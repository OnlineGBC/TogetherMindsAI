# cloudbuild.yaml
# ----------------
# CI/CD pipeline for TogetherMindsAI on Google Cloud Build.
#
# Trigger (deploy-on-push-main) is disabled — run manually via Cloud Build UI or gcloud builds submit.
#
# Steps:
#   1. Build the Docker image
#   2. Push to Artifact Registry
#   3. Deploy to Cloud Run
#
# Required substitutions (set in Cloud Build trigger UI):
#   _REGION             — GCP region, e.g. us-central1
#   _SERVICE_NAME       — Cloud Run service name, e.g. togethermindsai
#   _AR_REPO            — Artifact Registry repo, e.g. togethermindsai-repo
#   _SQL_CONN_NAME      — Cloud SQL connection name (PROJECT:REGION:INSTANCE)
# Note: _SA_EMAIL removed — $PROJECT_ID cannot be used inside substitution values;
#       the service account is referenced directly in the deploy args instead.

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: togethermindsai
  _AR_REPO: togethermindsai-repo
  _SQL_CONN_NAME: togethermindsai-python:us-central1:togethermindsai-db
  _TAG: latest

steps:
  # ── 0. Pull previous image for layer caching ────────────────────────────────
  # || true so the step doesn't fail on the very first build (no image yet).
  - name: gcr.io/cloud-builders/docker
    id: pull-cache
    entrypoint: bash
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG} || true

  # ── 1. Build ────────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --cache-from
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}
      - --build-arg
      - REBUILD_DEPS=7
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}
      - .

  # ── 2. Push ─────────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}

  # ── 3. Deploy to Cloud Run ───────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --service-account
      - togethermindsai-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances
      - ${_SQL_CONN_NAME}
      - --set-secrets
      - SECRET_KEY=SECRET_KEY:latest
      - --set-secrets
      - ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest
      - --set-secrets
      - CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS:latest
      - --set-secrets
      - RATE_WINDOW_SECONDS=RATE_WINDOW_SECONDS:latest
      - --set-secrets
      - RATE_MAX_MESSAGES=RATE_MAX_MESSAGES:latest
      - --set-secrets
      - MAX_MESSAGE_LENGTH=MAX_MESSAGE_LENGTH:latest
      # ICD-grounding cosine thresholds — tunable without an image rebuild.
      - --set-secrets
      - EMBEDDING_MIN_SIM_CARD=EMBEDDING_MIN_SIM_CARD:latest
      - --set-secrets
      - EMBEDDING_MIN_SIM_BLOCK=EMBEDDING_MIN_SIM_BLOCK:latest
      - --set-secrets
      - CLOUD_SQL_CONNECTION_NAME=CLOUD_SQL_CONNECTION_NAME:latest
      - --set-secrets
      - FIELD_ENCRYPTION_KEY=FIELD_ENCRYPTION_KEY:latest
      - --set-secrets
      - AI_COOLDOWN_SECONDS=AI_COOLDOWN_SECONDS:latest
      - --set-secrets
      - SILENCE_NUDGE_SECONDS=SILENCE_NUDGE_SECONDS:latest
      - --set-secrets
      - FEEDBACK_SMTP_USER=FEEDBACK_SMTP_USER:latest
      - --set-secrets
      - FEEDBACK_SMTP_PASSWORD=FEEDBACK_SMTP_PASSWORD:latest
      - --set-secrets
      - FEEDBACK_TO_EMAIL=FEEDBACK_TO_EMAIL:latest
      # Confidential conferencing (LiveKit audio/video + AssemblyAI transcription).
      # Without all four, RTC_ENABLED is false and the room renders without A/V.
      - --set-secrets
      - LIVEKIT_URL=LIVEKIT_URL:latest
      - --set-secrets
      - LIVEKIT_API_KEY=LIVEKIT_API_KEY:latest
      - --set-secrets
      - LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest
      # Secret is named ASSEMBLYAI_API; the app reads ASSEMBLYAI_API_KEY.
      - --set-secrets
      - ASSEMBLYAI_API_KEY=ASSEMBLYAI_API:latest
      # OAuth login for clinicians/clients (Google + Microsoft).
      - --set-secrets
      - GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest
      - --set-secrets
      - GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest
      - --set-secrets
      - MICROSOFT_CLIENT_ID=MICROSOFT_CLIENT_ID:latest
      - --set-secrets
      - MICROSOFT_CLIENT_SECRET=MICROSOFT_CLIENT_SECRET:latest
      # Admin comp-access console (/accessadmin). Without ADMIN_EMAILS the
      # console is unreachable, so an unconfigured deploy cannot expose it.
      - --set-secrets
      - ADMIN_EMAILS=ADMIN_EMAILS:latest
      - --set-secrets
      - ADMIN_TOTP_SECRET=ADMIN_TOTP_SECRET:latest
      # Subscription billing (Phase 4 Step 4 — Stripe) + A/V recording (Phase 4).
      # Plain env vars (not secrets): flip BILLING_ENABLED=false to restore full
      # access; RECORDING_ENABLED gates the Premium recording feature.
      - --set-env-vars
      - BILLING_ENABLED=false,RECORDING_ENABLED=true
      # Stripe secrets PINNED to :2 = LIVE keys (verified: :1 is sk_test_, :2 is
      # sk_live_). Still pinned rather than :latest so a new secret version cannot
      # silently change what production charges against. To revert to test mode,
      # set these four back to :1 and redeploy.
      # NOTE: BILLING_ENABLED is still false above — live keys are armed but no
      # customer is charged until that flag is flipped.
      - --set-secrets
      - STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:2
      - --set-secrets
      - STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:2
      - --set-secrets
      - STRIPE_PRICE_PRO=STRIPE_PRICE_PRO:2
      - --set-secrets
      - STRIPE_PRICE_PREMIUM=STRIPE_PRICE_PREMIUM:2
      # min-instances must always be 1 — keeps a warm worker so couple/group
      # SocketIO sessions don't pay a 10-15s cold-start penalty on first message.
      - --min-instances
      - "1"
      - --max-instances
      - "1"
      - --memory
      - 2Gi
      - --cpu
      - "1"
      - --timeout
      - "120"
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
  # E2_HIGHCPU_8 gives 8 vCPUs and 8 GB RAM for a faster dependency build.
  machineType: E2_HIGHCPU_8
