# cloudbuild.yaml
# ----------------
# CI/CD pipeline for TogetherMindsAI on Google Cloud Build.
#
# Trigger (deploy-on-push-main) is disabled — run manually via Cloud Build UI or gcloud builds submit.
#
# Steps:
#   1. Build the Docker image
#   2. Push to Artifact Registry
#   3. Deploy to Cloud Run
#
# Required substitutions (set in Cloud Build trigger UI):
#   _REGION             — GCP region, e.g. us-central1
#   _SERVICE_NAME       — Cloud Run service name, e.g. togethermindsai
#   _AR_REPO            — Artifact Registry repo, e.g. togethermindsai-repo
#   _SQL_CONN_NAME      — Cloud SQL connection name (PROJECT:REGION:INSTANCE)
# Note: _SA_EMAIL removed — $PROJECT_ID cannot be used inside substitution values;
#       the service account is referenced directly in the deploy args instead.

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: togethermindsai
  _AR_REPO: togethermindsai-repo
  _SQL_CONN_NAME: togethermindsai-python:us-central1:togethermindsai-db
  _TAG: latest

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/HF_TOKEN/versions/latest
      env: HF_TOKEN

steps:
  # ── 0. Pull previous image for layer caching ────────────────────────────────
  # || true so the step doesn't fail on the very first build (no image yet).
  - name: gcr.io/cloud-builders/docker
    id: pull-cache
    entrypoint: bash
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG} || true

  # ── 1. Build ────────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    secretEnv:
      - HF_TOKEN
    args:
      - build
      - --cache-from
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}
      - --build-arg
      - HF_TOKEN=$$HF_TOKEN
      - --build-arg
      - REBUILD_DEPS=3
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}
      - .

  # ── 2. Push ─────────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}

  # ── 3. Deploy to Cloud Run ───────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --service-account
      - togethermindsai-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances
      - ${_SQL_CONN_NAME}
      - --set-secrets
      - SECRET_KEY=SECRET_KEY:latest
      - --set-secrets
      - ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
      - --set-secrets
      - OPENAI_API_KEY=OPENAI_API_KEY:latest
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest
      - --set-secrets
      - CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS:latest
      - --set-secrets
      - RATE_WINDOW_SECONDS=RATE_WINDOW_SECONDS:latest
      - --set-secrets
      - RATE_MAX_MESSAGES=RATE_MAX_MESSAGES:latest
      - --set-secrets
      - MAX_MESSAGE_LENGTH=MAX_MESSAGE_LENGTH:latest
      - --set-secrets
      - CLOUD_SQL_CONNECTION_NAME=CLOUD_SQL_CONNECTION_NAME:latest
      - --set-secrets
      - FIELD_ENCRYPTION_KEY=FIELD_ENCRYPTION_KEY:latest
      - --set-secrets
      - AI_COOLDOWN_SECONDS=AI_COOLDOWN_SECONDS:latest
      - --set-secrets
      - SILENCE_NUDGE_SECONDS=SILENCE_NUDGE_SECONDS:latest
      - --set-secrets
      - FEEDBACK_SMTP_USER=FEEDBACK_SMTP_USER:latest
      - --set-secrets
      - FEEDBACK_SMTP_PASSWORD=FEEDBACK_SMTP_PASSWORD:latest
      - --set-secrets
      - FEEDBACK_TO_EMAIL=FEEDBACK_TO_EMAIL:latest
      # min-instances must always be 1 — keeps a warm worker so couple/group
      # SocketIO sessions don't pay a 10-15s cold-start penalty on first message.
      - --min-instances
      - "1"
      - --max-instances
      - "1"
      - --memory
      - 2Gi
      - --cpu
      - "1"
      - --timeout
      - "120"
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
  # E2_HIGHCPU_8 gives 8 vCPUs and 8 GB RAM — needed for pip-installing PyTorch
  machineType: E2_HIGHCPU_8
