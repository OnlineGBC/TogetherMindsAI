# cloudbuild.yaml
# ----------------
# CI/CD pipeline for TogetherMindsAI on Google Cloud Build.
#
# Triggered automatically on every push to the main branch.
#
# Steps:
#   1. Build the Docker image
#   2. Push to Artifact Registry
#   3. Deploy to Cloud Run
#
# Required substitutions (set in Cloud Build trigger UI):
#   _REGION             — GCP region, e.g. us-central1
#   _SERVICE_NAME       — Cloud Run service name, e.g. togethermindsai
#   _AR_REPO            — Artifact Registry repo, e.g. togethermindsai-repo
#   _SQL_CONN_NAME      — Cloud SQL connection name (PROJECT:REGION:INSTANCE)
#   _SA_EMAIL           — Service account email for Cloud Run

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: togethermindsai
  _AR_REPO: togethermindsai-repo
  _SQL_CONN_NAME: togethermindsai-python:us-central1:togethermindsai-db
  _SA_EMAIL: togethermindsai-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _TAG: latest

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/HF_TOKEN/versions/latest
      env: HF_TOKEN

steps:
  # ── 1. Build ────────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    secretEnv:
      - HF_TOKEN
    args:
      - build
      - --build-arg
      - HF_TOKEN=$$HF_TOKEN
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}
      - .

  # ── 2. Push ─────────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}

  # ── 3. Deploy to Cloud Run ───────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --service-account
      - ${_SA_EMAIL}
      - --add-cloudsql-instances
      - ${_SQL_CONN_NAME}
      - --set-secrets
      - SECRET_KEY=SECRET_KEY:latest
      - --set-secrets
      - ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest
      - --set-secrets
      - CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS:latest
      - --set-secrets
      - RATE_WINDOW_SECONDS=RATE_WINDOW_SECONDS:latest
      - --set-secrets
      - RATE_MAX_MESSAGES=RATE_MAX_MESSAGES:latest
      - --set-secrets
      - MAX_MESSAGE_LENGTH=MAX_MESSAGE_LENGTH:latest
      - --set-secrets
      - CLOUD_SQL_CONNECTION_NAME=CLOUD_SQL_CONNECTION_NAME:latest
      - --min-instances
      - "0"
      - --max-instances
      - "3"
      - --memory
      - 2Gi
      - --cpu
      - "1"
      - --timeout
      - "120"
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
  # E2_HIGHCPU_8 gives 8 vCPUs and 8 GB RAM — needed for pip-installing PyTorch
  machineType: E2_HIGHCPU_8
